<title>Bone Zone — Short Squeeze Our Inflated Assets · HTC 2026</title>
<style>
:root{
  /* palette sampled from the van art */
  --bg:#0A0F0C; --surf:#131A14; --surf2:#1C261D; --line:#2C3A2C; --brown:#645234;
  --ink:#E8E2CE; --muted:#9AA07F; --dim:#6A7159;
  --gold:#F5C542; --bonegold:#F2DD9C;
  --up:#5FCB6E; --down:#E2662C; --live:#F5C542;
  --van1:#D9CFA8; --van2:#6FA84A;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --poster:Impact,Haettenschweiler,"Arial Narrow Bold","Roboto Condensed","Arial Narrow",var(--sans);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45;
  padding-bottom:calc(64px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
/* poster type: heavy condensed with a hard dark outline, like the van art */
.poster{font-family:var(--poster);font-weight:700;text-transform:uppercase;letter-spacing:.01em;
  color:var(--gold);
  text-shadow:-1px -1px 0 #0A0F0C,1px -1px 0 #0A0F0C,-1px 1px 0 #0A0F0C,1px 1px 0 #0A0F0C,0 2px 0 #3A2E18}

/* ---------- masthead ---------- */
header{
  display:flex;align-items:center;gap:12px;
  padding:11px 15px 12px; position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg,#16211A 0%,#0D140F 100%);
  border-bottom:1px solid var(--brown);
  box-shadow:0 3px 14px rgba(226,102,44,.14);
}
header img{width:44px;height:44px;border-radius:9px;flex:0 0 44px;
  border:1px solid var(--brown);display:block}
.mast{min-width:0;flex:1}
.wordmark{font-family:var(--poster);font-weight:700;text-transform:uppercase;
  font-size:21px;line-height:1;letter-spacing:.005em;color:var(--gold);
  text-shadow:-1px -1px 0 #0A0F0C,1px -1px 0 #0A0F0C,-1px 1px 0 #0A0F0C,1px 1px 0 #0A0F0C,0 2px 0 #3A2E18;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.11em;color:var(--muted);margin-top:4px}

/* ---------- cards ---------- */
.wrap{padding:14px 15px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.live{border-color:rgba(245,197,66,.4);background:linear-gradient(180deg,rgba(245,197,66,.07),var(--surf))}
.card.bone{border-color:rgba(226,102,44,.45);
  background:linear-gradient(180deg,rgba(226,102,44,.11),var(--surf) 60%)}

/* ---------- now panel ---------- */
.livetop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.pulse{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;color:var(--live)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:bp 1.8s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.runner{font-family:var(--poster);font-weight:700;text-transform:uppercase;
  font-size:38px;line-height:1;color:var(--ink);letter-spacing:.005em;
  text-shadow:-1px -1px 0 #0A0F0C,1px -1px 0 #0A0F0C,-1px 1px 0 #0A0F0C,1px 1px 0 #0A0F0C,0 2px 0 #2A3428}
.legline{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:14px}
.cel{background:var(--surf2);padding:9px 10px}
.cel .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px;color:var(--ink)}
.bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .6s;
  background:linear-gradient(90deg,var(--gold),var(--down))}

/* ---------- bone zone banner (signature) ---------- */
.bz{display:flex;align-items:center;gap:9px;margin:-2px 0 11px;padding:8px 10px;
  border-radius:8px;border:1px solid rgba(226,102,44,.4);
  background:linear-gradient(90deg,rgba(226,102,44,.2),rgba(226,102,44,.04))}
.bz .skull{font-size:17px;line-height:1}
.bz .bzt{font-family:var(--poster);font-weight:700;text-transform:uppercase;font-size:15px;
  line-height:1.05;color:var(--gold);letter-spacing:.02em;
  text-shadow:-1px -1px 0 #0A0F0C,1px -1px 0 #0A0F0C,-1px 1px 0 #0A0F0C,1px 1px 0 #0A0F0C}
.bz .bzs{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#E9A87C;margin-top:2px}

/* ---------- finish / variance ---------- */
.finish{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.finish .big{font-family:var(--poster);font-weight:700;font-size:38px;line-height:1;color:var(--gold);
  text-shadow:-1px -1px 0 #0A0F0C,1px -1px 0 #0A0F0C,-1px 1px 0 #0A0F0C,1px 1px 0 #0A0F0C,0 2px 0 #3A2E18}
.var{font-family:var(--mono);font-size:14px;font-weight:700;padding:5px 9px;border-radius:7px;white-space:nowrap}
.var.up{color:var(--up);background:rgba(95,203,110,.14)}
.var.down{color:var(--down);background:rgba(226,102,44,.15)}
.var.flat{color:var(--muted);background:var(--surf2)}

/* ---------- leg rows ---------- */
.secthead{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.secthead .rule{flex:1;height:1px;background:var(--line)}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows.bonezone{border-color:rgba(226,102,44,.35)}
.row{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surf);
  border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row.done{background:#101610}
.row.now{background:linear-gradient(90deg,rgba(245,197,66,.13),var(--surf))}
.row.bz{background:linear-gradient(90deg,rgba(226,102,44,.07),var(--surf))}
.row.bz.done{background:#141310}
.legno{font-family:var(--mono);font-size:12px;font-weight:700;width:26px;flex:0 0 26px;text-align:right;color:var(--dim)}
.row.done .legno{color:var(--up)}
.row.now .legno{color:var(--live)}
.vbar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 3px}
.rmid{flex:1;min-width:0}
.rname{font-size:15px;font-weight:600;color:var(--ink)}
.rmeta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{text-align:right;flex:0 0 auto}
.rtime .t{font-family:var(--mono);font-size:14px;font-weight:700}
.rtime .d{font-family:var(--mono);font-size:10px;margin-top:2px}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  padding:1px 4px;border-radius:3px;background:var(--surf2);color:var(--muted);margin-left:4px}
.tag.vh{color:var(--down);background:rgba(226,102,44,.16)}
.tag.h{color:var(--bonegold);background:rgba(242,221,156,.11)}

/* ---------- expanded detail ---------- */
.det{background:#0D130E;border-bottom:1px solid var(--line);padding:13px 12px 15px}
.det p{margin:0 0 11px;font-size:13px;color:var(--muted);line-height:1.5}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.flag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 7px;
  border-radius:5px;background:var(--surf2);color:var(--muted)}
.flag.warn{color:var(--gold);background:rgba(245,197,66,.13)}
.flag.hot{color:var(--down);background:rgba(226,102,44,.15)}
.flag.cold{color:var(--van2);background:rgba(111,168,74,.14)}
.btnrow{display:flex;gap:8px;align-items:center}
button{font-family:inherit;font-size:14px;border-radius:9px;border:1px solid var(--line);
  background:var(--surf2);color:var(--ink);padding:11px 14px;cursor:pointer;font-weight:500}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);border-color:var(--gold);color:#14170F;
  font-family:var(--poster);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  font-size:16px;flex:1}
button.ghost{background:transparent;color:var(--muted)}
button.danger{color:var(--down);border-color:rgba(226,102,44,.32);background:transparent}
input[type=time],input[type=text],input[type=number],input[type=datetime-local]{
  font-family:var(--mono);font-size:15px;background:var(--surf2);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%}
input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

/* ---------- team ---------- */
.tr{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surf);
  border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:none}
.pos{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim);width:20px;flex:0 0 20px}
.paces{display:flex;gap:5px}
.paces input{width:52px;text-align:center;padding:7px 3px;font-size:13px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,7,5,.76);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surf);
  border-top:1px solid var(--brown);border-radius:16px 16px 0 0;
  padding:16px 15px calc(20px + var(--safe-b));max-height:88vh;overflow:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:34px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.fld{margin-bottom:14px}
.fld label{display:block;margin-bottom:6px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 0;border-top:1px solid var(--line)}
.tog .txt{font-size:14px;font-weight:600}
.tog .sub2{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.45}
.sw{position:relative;width:46px;height:27px;flex:0 0 46px;background:var(--surf2);
  border:1px solid var(--line);border-radius:14px;cursor:pointer}
.sw.on{background:var(--up);border-color:var(--up)}
.sw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:var(--ink);transition:transform .2s}
.sw.on i{transform:translateX(19px);background:#0A0F0C}
textarea{width:100%;font-family:var(--mono);font-size:11px;background:var(--surf2);
  color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px;
  min-height:92px;resize:vertical;word-break:break-all}

/* ---------- tabs ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(10,15,12,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--brown);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:none;border-radius:0;padding:11px 4px 12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:700}
nav button.on{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.seg button.on{background:var(--gold);color:#14170F;border-color:var(--gold);font-weight:700}
.hide{display:none}
.foot{padding:8px 2px 0;font-size:11px;color:var(--dim);line-height:1.6}
</style>
</head>

const KEY='htc1157';
const store=(()=>{ let mem={};
  try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t');
       return {g:k=>localStorage.getItem(k), s:(k,v)=>localStorage.setItem(k,v), ok:true};
  }catch(e){ return {g:k=>mem[k]??null, s:(k,v)=>{mem[k]=v}, ok:false}; }
})();
let S=load();
function load(){
  const d={startISO:'2026-08-28T07:30', times:{}, runners:DEFAULT_RUNNERS.map(r=>({...r,p:[...r.p]})),
           grade:true, carry:false};
  try{ const raw=store.g(KEY); if(!raw) return d; const o=JSON.parse(raw);
       return {...d,...o, runners:(o.runners&&o.runners.length===12)?o.runners:d.runners}; }
  catch(e){ return d; }
}
function save(){ try{ store.s(KEY,JSON.stringify(S)); }catch(e){} }

/* ============================================================
   PROJECTION MODEL
   Uphill costs ~25 sec per 100 ft climbed. Downhill credit tapers to
   zero by ~6% average grade and reverses past it — the Timberline
   drops cost time and wreck quads rather than banking minutes.
   ============================================================ */
function legMinutes(leg,pace){
  const [mi,,up,dn]=LEGS[leg-1];
  const base=mi*pace;
  if(!S.grade) return base;
  const g=(dn/(mi*5280))*100;
  const rate = g<=3 ? 0.12 : (g<=6 ? 0.12*(6-g)/3 : -0.05);
  return base + up*0.25/60 - dn*rate/60;
}
const rIdx=l=>(l-1)%12, pIdx=l=>Math.floor((l-1)/12);
const baseMin=l=>legMinutes(l,S.runners[rIdx(l)].p[pIdx(l)]);

function compute(){
  const sched=new Date(S.startISO).getTime();
  const P=[sched]; for(let i=1;i<=36;i++) P[i]=P[i-1]+baseMin(i)*60000;
  const carry={};
  if(S.carry){ const acc={};
    for(let i=1;i<=36;i++){ const a=S.times[i],b=S.times[i-1];
      if(a&&b){ const k=rIdx(i); acc[k]=acc[k]||{a:0,p:0};
        acc[k].a+=(new Date(a)-new Date(b))/60000; acc[k].p+=baseMin(i); } }
    for(const k in acc) if(acc[k].p>0) carry[k]=acc[k].a/acc[k].p; }
  const T=[],A=[];
  T[0]=S.times[0]?new Date(S.times[0]).getTime():sched; A[0]=!!S.times[0];
  for(let i=1;i<=36;i++){
    if(S.times[i]){ T[i]=new Date(S.times[i]).getTime(); A[i]=true; }
    else { T[i]=T[i-1]+baseMin(i)*(carry[rIdx(i)]||1)*60000; A[i]=false; } }
  return {P,T,A,carry};
}

/* ============================================================
   FORMATTING
   ============================================================ */
const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function hm(ms){ const d=new Date(ms); let h=d.getHours(); const m=d.getMinutes();
  const ap=h>=12?'p':'a'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+ap; }
function dhm(ms){ return D[new Date(ms).getDay()]+' '+hm(ms); }
function dur(ms){ const t=Math.max(0,Math.round(ms/60000));
  return Math.floor(t/60)+'h'+String(t%60).padStart(2,'0'); }
function mmss(ms){ const s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function delta(ms){ const t=Math.round(ms/60000), s=t<0?'−':'+', a=Math.abs(t);
  return s+(a>=60?Math.floor(a/60)+'h'+String(a%60).padStart(2,'0'):a+'m'); }
function toLocalInput(ms){ return new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16); }
function isNight(ms){ const h=new Date(ms).getHours(); return h>=18||h<7; }

    const b=document.getElementById('t-'+x); if(b) b.classList.toggle('on',x===t); });

  for(let i=1;i<=36;i++){ if(now>=T[i-1]&&now<T[i]){ cur=i; break; } }

  if(cur===-1){
    h+=`<div class="card"><div class="lbl">Start line · Timberline Lodge</div>
      <div class="runner" style="margin-top:7px">${dur(T[0]-now)}</div>
      <div class="legline">until ${dhm(T[0])} · Ben on Leg 1</div>
      <div class="legline" style="color:var(--gold)">Van 1 checks in 30 min early. Van 2 goes straight to Exchange 6.</div></div>`;
  } else if(cur===37){
    h+=`<div class="card bone"><div class="bz"><span class="skull">💀</span>
      <div><div class="bzt">Out of the Bone Zone</div>
      <div class="bzs">196.68 MILES · SEASIDE</div></div></div>
      <div class="runner">${dur(T[36]-T[0])}</div>
      <div class="legline">${dhm(T[36])} · ${((T[36]-T[0])/60000/196.68).toFixed(2)} min/mi · go find the beer garden</div></div>`;

    const r=S.runners[rIdx(cur)], mi=LEGS[cur-1][0], rate=LEGS[cur-1][1];

      <div class="bzs">NO SIGNAL · FULL DARK · LEGS ${BZ_FROM}–${BZ_TO}</div></div></div>`;
    h+=`<div class="livetop"><span class="pulse"><span class="dot"></span>ON COURSE</span>
        <span class="lbl">Leg ${cur} of 36</span></div>
      <div class="runner">${r.n}</div>
      <div class="legline">Van ${r.v} · ${mi.toFixed(2)} mi · ${rate}${isNight(now)?' · headlamp + vest + flashers':''}</div>
      <div class="grid3">
        <div class="cel"><div class="lbl">Elapsed</div><div class="v">${mmss(el)}</div></div>
        <div class="cel"><div class="lbl">Handoff</div><div class="v">${hm(T[cur])}</div></div>
        <div class="cel"><div class="lbl">Remaining</div><div class="v">${mmss(T[cur]-now)}</div></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="btnrow" style="margin-top:13px">
        <button class="primary" onclick="logNow(${cur})">Log handoff now</button></div></div>`;
    if(cur<36){ const nx=S.runners[rIdx(cur+1)];
      h+=`<div class="card" style="padding:11px 14px"><div class="lbl">On deck</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px">
          <div><span style="font-size:17px;font-weight:700">${nx.n}</span>
          <span class="legline"> Leg ${cur+1} · ${LEGS[cur][0].toFixed(2)} mi · ${LEGS[cur][1]}</span></div>
          <div class="mono" style="font-size:15px;font-weight:700">${hm(T[cur])}</div></div></div>`; }
  }

  const v=T[36]-P[36], cls=Math.abs(v)<60000?'flat':(v<0?'up':'down');
  h+=`<div class="card"><div class="lbl">Projected finish · Seaside</div>
    <div class="finish" style="margin-top:7px">
      <div><div class="big">${dhm(T[36])}</div>
        <div class="legline">${dur(T[36]-T[0])} elapsed · ${((T[36]-T[0])/60000/196.68).toFixed(2)} min/mi</div></div>
      <div class="var ${cls}">${delta(v)}</div></div>
    <div class="legline" style="margin-top:11px;color:var(--dim)">
      Plan ${dhm(P[36])} · HTC estimate Sat 7:34a · course closes Sat 9:00p</div></div>`;

  h+=`<div class="secthead"><span class="poster" style="font-size:15px">Van exchanges</span><span class="rule"></span></div><div class="rows">`;
  MAJOR.forEach(x=>{ const done=A[x], takes=(x===6||x===18||x===30)?2:1;
    h+=`<div class="row ${done?'done':''} ${inBZ(x)?'bz':''}" style="cursor:default">
      <div class="legno">${x}</div>
      <div class="vbar" style="background:${takes===1?'var(--van1)':'var(--van2)'}"></div>
      <div class="rmid"><div class="rname" style="font-size:14px">Exchange ${x}</div>
      <div class="rmeta">Van ${takes} takes over</div></div>
      <div class="rtime"><div class="t">${hm(T[x])}</div>
      <div class="d" style="color:var(--dim)">${done?'logged':'projected'}</div></div></div>`; });
  h+=`</div><div class="foot">Times recalculate from the last handoff you log. Everything works with no signal — legs ${BZ_FROM} through ${BZ_TO} have none.</div>`;
  document.getElementById('v-now').innerHTML=h;
}

function setVan(v){ VAN=v; render(); }
function renderLegs({P,T,A}){
  const now=Date.now();
  let h=`<div class="seg">
    <button class="${VAN===0?'on':''}" onclick="setVan(0)">ALL 36</button>
    <button class="${VAN===1?'on':''}" onclick="setVan(1)">VAN 1</button>
    <button class="${VAN===2?'on':''}" onclick="setVan(2)">VAN 2</button></div>`;
  let open=false, marked=false;
  for(let i=1;i<=36;i++){
    const r=S.runners[rIdx(i)]; if(VAN&&r.v!==VAN) continue;
    if(inBZ(i)&&!marked){ if(open){h+='</div>';open=false;} marked=true;
      h+=`<div class="secthead"><span class="skull" style="font-size:15px">💀</span>
        <span class="poster" style="font-size:16px">The Bone Zone</span><span class="rule"></span>
        <span class="lbl" style="color:var(--down)">NO SIGNAL</span></div>`; }
    if(!open){ h+=`<div class="rows ${marked&&inBZ(i)?'bonezone':''}">`; open=true; }
    const mi=LEGS[i-1][0], rate=LEGS[i-1][1];
    const done=A[i], live=(now>=T[i-1]&&now<T[i]&&!done);
    const dv=T[i]-P[i], vc=Math.abs(dv)<60000?'var(--dim)':(dv<0?'var(--up)':'var(--down)');
    const rt=rate==='VH'?'vh':(rate==='H'?'h':'');
    h+=`<div class="row ${done?'done':''} ${live?'now':''} ${inBZ(i)?'bz':''}" onclick="toggle(${i})">
      <div class="legno">${i}</div>
      <div class="vbar" style="background:${r.v===1?'var(--van1)':'var(--van2)'}"></div>
      <div class="rmid"><div class="rname">${r.n}</div>
        <div class="rmeta">${mi.toFixed(2)} mi<span class="tag ${rt}">${rate}</span>
        ${isNight(T[i-1])?'<span class="tag">NIGHT</span>':''}
        ${MAJOR.includes(i)?'<span class="tag">VAN SWAP</span>':''}</div></div>
      <div class="rtime"><div class="t">${hm(T[i-1])}</div>
        <div class="d" style="color:${vc}">${done?delta(dv):dur(T[i]-T[i-1]).replace('h',':')}</div></div></div>`;
    if(OPEN===i) h+=detail(i,T,A);
    if(i===BZ_TO&&marked){ h+='</div>'; open=false;
      h+=`<div class="secthead"><span class="poster" style="font-size:15px">Home stretch</span><span class="rule"></span></div>`; }
  }
  if(open) h+='</div>';
  h+=`<div class="foot">Tap any leg for terrain notes and to log or edit its handoff. One tap sets that runner's finish and the next runner's start together.</div>`;
  document.getElementById('v-legs').innerHTML=h;
}

function detail(i,T,A){
  const [mi,rate,up,dn,note]=LEGS[i-1], f=[];
  if(isNight(T[i-1])) f.push(['warn','HEADLAMP + VEST + FLASHERS']);
  if(inBZ(i)) f.push(['hot','NO CELL SIGNAL']);
  if(GRAVEL.includes(i)) f.push(['','GRAVEL / DUST']);
  if(MAJOR.includes(i)) f.push(['cold','MAJOR VAN EXCHANGE']);
  f.push(['',`+${up} / −${dn} FT`]);
  return `<div class="det">
    <div class="flags">${f.map(([c,t])=>`<span class="flag ${c}">${t}</span>`).join('')}</div>
    <p>${note}</p>
    <div class="btnrow">
      <button class="primary" onclick="event.stopPropagation();logNow(${i})">
        ${A[i]?'Re-log now':'Log handoff now'}</button>
      <button onclick="event.stopPropagation();editTime(${i})">Edit</button>
      ${A[i]?`<button class="danger" onclick="event.stopPropagation();clearTime(${i})">Clear</button>`:''}
    </div></div>`;
}

function renderTeam(){
  let h=`<div class="secthead"><span class="poster" style="font-size:15px">The Roster</span><span class="rule"></span>
    <span class="lbl">MIN/MI BY LEG</span></div><div class="rows">`;
  S.runners.forEach((r,k)=>{
    const legs=[k+1,k+13,k+25], mi=legs.reduce((a,l)=>a+LEGS[l-1][0],0);
    h+=`<div class="tr"><div class="pos">${k+1}</div>
      <div class="vbar" style="background:${r.v===1?'var(--van1)':'var(--van2)'}"></div>
      <div class="rmid"><div class="rname">${r.n}</div>
        <div class="rmeta">Legs ${legs.join(' · ')} · ${mi.toFixed(2)} mi</div></div>
      <div class="paces">${[0,1,2].map(j=>
        `<input type="number" step="0.05" min="3" max="20" value="${r.p[j].toFixed(2)}"
          onchange="setPace(${k},${j},this.value)" aria-label="${r.n} leg ${j+1} pace">`).join('')}</div></div>`; });
  h+=`</div><div class="foot">196.68 miles across 36 legs. Paces are flat-road effort — the grade model
    adjusts each leg for its own climb and descent. Change a pace and every leg that runner has left reprojects.</div>`;
  document.getElementById('v-team').innerHTML=h;
}

/* ============================================================
   ACTIONS
   ============================================================ */
function toggle(i){ OPEN=(OPEN===i?null:i); render(); }
function logNow(i){ const d=new Date(); d.setSeconds(0,0);
  S.times[i]=toLocalInput(d.getTime()); save(); OPEN=null; render(); }
function clearTime(i){ delete S.times[i]; save(); render(); }
function setPace(k,j,v){ const n=parseFloat(v); if(!isNaN(n)&&n>0){ S.runners[k].p[j]=n; save(); render(); } }
function editTime(i){ const {T}=compute();
  const v=prompt(`Handoff time at Exchange ${i}\nFormat YYYY-MM-DDTHH:MM (24-hour)`, S.times[i]||toLocalInput(T[i]));
  if(v && !isNaN(new Date(v).getTime())){ S.times[i]=v; save(); render(); } }

function openSheet(){ const n=Object.keys(S.times).length;
  document.getElementById('sheetbody').innerHTML=`
    <div class="fld"><label class="lbl">Team start time</label>
      <input type="datetime-local" value="${S.startISO}" onchange="setStart(this.value)"></div>
    <div class="tog"><div><div class="txt">Grade adjustment</div>
      <div class="sub2">Adds time for climbing, credits gentle descents, and penalises the quad-wrecking drops on legs 1 and 2.</div></div>
      <div class="sw ${S.grade?'on':''}" onclick="flip('grade')" role="switch" tabindex="0"><i></i></div></div>
    <div class="tog"><div><div class="txt">Carry observed pace forward</div>
      <div class="sub2">If a runner is beating or missing their estimate, apply that same ratio to their remaining legs. Leave off until a few legs are in the books.</div></div>
      <div class="sw ${S.carry?'on':''}" onclick="flip('carry')" role="switch" tabindex="0"><i></i></div></div>
    <div class="tog" style="display:block">
      <div class="txt" style="margin-bottom:4px">Van handoff</div>
      <div class="sub2" style="margin-bottom:9px">Copy this at a major exchange and paste it into the other van's phone. ${n} time${n===1?'':'s'} logged.</div>
      <textarea readonly onclick="this.select()">${btoa(JSON.stringify({t:S.times,r:S.runners,s:S.startISO}))}</textarea>
      <div class="btnrow" style="margin-top:9px">
        <button class="primary" onclick="pasteSync()">Paste from other van</button></div></div>
    <div class="tog"><div><div class="txt">Reset logged times</div>
      <div class="sub2">Clears every handoff. Roster and paces stay.</div></div>
      <button class="danger" onclick="resetTimes()">Reset</button></div>
    <div class="foot">${store.ok?'Times are saved on this phone.':'Preview mode — times will not survive a reload until this is hosted.'}</div>`;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on'); }
function setStart(v){ if(v){ S.startISO=v; save(); render(); } }
function flip(k){ S[k]=!S[k]; save(); openSheet(); render(); }
function resetTimes(){ if(confirm('Clear every logged handoff time?')){ S.times={}; save(); openSheet(); render(); } }
function pasteSync(){ const v=prompt('Paste the handoff code from the other van:'); if(!v) return;
  try{ const o=JSON.parse(atob(v.trim())); if(!o.t) throw 0;
    S.times=o.t; if(o.r&&o.r.length===12) S.runners=o.r; if(o.s) S.startISO=o.s;
    save(); openSheet(); render();
  }catch(e){ alert("That code didn't read cleanly. Copy the whole block from the other phone and try again."); } }

render();
setInterval(()=>{ if(TAB==='now'&&!document.hidden) render(); },1000);
</script>
</body>
</html>
