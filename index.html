<title>Bone Zone — Short Squeeze Our Inflated Assets · HTC 2026</title>
<style>
:root{
  /* palette measured against WCAG, not eyeballed. every value below
     clears 4.5:1 on --surf; the old --dim sat at 3.47:1 and was used
     for every small metadata line in the app. */
  --bg:#0B0E0C; --surf:#171B18; --surf2:#212722; --line:#333C36; --brown:#6E5C3C;
  --ink:#F4F6F2; --muted:#B3BDB6; --dim:#8B968E;
  --gold:#FFC93D; --up:#5BE38C; --down:#FF8A5B;
  --van1:#E6DFC8; --van2:#8FCB57;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --poster:Impact,Haettenschweiler,"Arial Narrow Bold","Roboto Condensed",var(--sans);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tap:52px;                     /* nothing interactive is smaller than this */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(150px + var(--safe-b));}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* poster type is now decoration only — it never carries data */
.poster{font-family:var(--poster);font-weight:700;text-transform:uppercase;letter-spacing:.01em;color:var(--gold)}

header{display:flex;align-items:center;gap:12px;padding:11px 15px;position:sticky;top:0;z-index:20;
  background:#10140F;border-bottom:1px solid var(--brown)}
header img{width:42px;height:42px;border-radius:10px;flex:0 0 42px;border:1px solid var(--brown);display:block}
.mast{min-width:0;flex:1}
.wordmark{font-family:var(--poster);font-weight:700;text-transform:uppercase;font-size:21px;
  line-height:1;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:-1px -1px 0 #0B0E0C,1px -1px 0 #0B0E0C,-1px 1px 0 #0B0E0C,1px 1px 0 #0B0E0C}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.09em;color:var(--muted);margin-top:4px}
.net{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;
  padding:9px 9px;border-radius:8px;white-space:nowrap;cursor:pointer;flex:0 0 auto;border:1px solid transparent}
.net.ok{color:var(--up);background:rgba(91,227,140,.14);border-color:rgba(91,227,140,.34)}
.net.sync{color:var(--muted);background:var(--surf2);border-color:var(--line)}
.net.off{color:var(--down);background:rgba(255,138,91,.14);border-color:rgba(255,138,91,.36)}
.net.watch{color:var(--van2);background:rgba(143,203,87,.14);border-color:rgba(143,203,87,.34)}

.wrap{padding:14px 15px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.card.live{border-color:rgba(255,201,61,.42);background:linear-gradient(180deg,rgba(255,201,61,.07),var(--surf))}
.card.bone{border-color:rgba(255,138,91,.45);background:linear-gradient(180deg,rgba(255,138,91,.1),var(--surf) 60%)}

.livetop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pulse{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;color:var(--gold);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:bp 1.8s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* name is data, so it reads in the sans face, not the poster face */
.runner{font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.08;color:var(--ink)}
.legline{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:7px;line-height:1.45}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.cel{background:var(--surf2);padding:11px 10px}
.cel .v{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:4px;color:var(--ink)}
.bar{height:7px;background:var(--surf2);border-radius:4px;overflow:hidden;margin-top:13px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .6s;
  background:linear-gradient(90deg,var(--gold),var(--down))}

.bz{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;padding:10px 11px;border-radius:10px;
  border:1px solid rgba(255,138,91,.42);background:linear-gradient(90deg,rgba(255,138,91,.2),rgba(255,138,91,.05))}
.bz .skull{font-size:19px;line-height:1}
.bz .bzt{font-family:var(--poster);font-weight:700;text-transform:uppercase;font-size:17px;
  line-height:1.05;color:var(--gold);letter-spacing:.02em}
.bz .bzs{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#FFB88F;margin-top:3px}

.finish{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.finish .big{font-family:var(--mono);font-size:33px;font-weight:700;line-height:1;
  color:var(--gold);letter-spacing:-.02em}
.var{font-family:var(--mono);font-size:15px;font-weight:700;padding:7px 10px;border-radius:8px;white-space:nowrap}
.var.up{color:var(--up);background:rgba(91,227,140,.15)}
.var.down{color:var(--down);background:rgba(255,138,91,.15)}
.var.flat{color:var(--muted);background:var(--surf2)}

.secthead{display:flex;align-items:center;gap:9px;margin:18px 0 9px}
.secthead .rule{flex:1;height:1px;background:var(--line)}
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rows.bonezone{border-color:rgba(255,138,91,.38)}
.row{display:flex;align-items:center;gap:12px;padding:14px 13px;background:var(--surf);
  border-bottom:1px solid var(--line);cursor:pointer;min-height:var(--tap)}
.row:last-child{border-bottom:none}
.row.done{background:#12160F}
.row.now{background:linear-gradient(90deg,rgba(255,201,61,.15),var(--surf))}
.row.bz{background:linear-gradient(90deg,rgba(255,138,91,.08),var(--surf))}
.row.bz.done{background:#161510}
.legno{font-family:var(--mono);font-size:14px;font-weight:700;width:28px;flex:0 0 28px;text-align:right;color:var(--dim)}
.row.done .legno{color:var(--up)}
.row.now .legno{color:var(--gold)}
.vbar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 4px}
.rmid{flex:1;min-width:0}
.rname{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.rmeta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{text-align:right;flex:0 0 auto}
.rtime .t{font-family:var(--mono);font-size:17px;font-weight:700}
.rtime .d{font-family:var(--mono);font-size:12px;margin-top:3px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  padding:2px 5px;border-radius:4px;background:var(--surf2);color:var(--muted);margin-left:5px}
.tag.vh{color:var(--down);background:rgba(255,138,91,.18)}
.tag.h{color:var(--gold);background:rgba(255,201,61,.14)}

.det{background:#101410;border-bottom:1px solid var(--line);padding:14px 13px 16px}
.det p{margin:0 0 12px;font-size:14.5px;color:var(--muted);line-height:1.55}
.flags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.flag{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:5px 8px;
  border-radius:6px;background:var(--surf2);color:var(--muted)}
.flag.warn{color:var(--gold);background:rgba(255,201,61,.14)}
.flag.hot{color:var(--down);background:rgba(255,138,91,.16)}
.flag.cold{color:var(--van2);background:rgba(143,203,87,.16)}

.prof{background:#0C100D;border:1px solid var(--line);border-radius:10px;padding:9px 10px 5px;margin-bottom:12px}
.profhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.profg{font-family:var(--mono);font-size:12px;letter-spacing:.03em;white-space:nowrap}
.profax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
  color:var(--dim);letter-spacing:.05em;margin-top:2px}

.btnrow{display:flex;gap:9px;align-items:stretch}
button{font-family:inherit;font-size:16px;border-radius:11px;border:1px solid var(--line);
  background:var(--surf2);color:var(--ink);padding:14px 15px;cursor:pointer;font-weight:600;
  min-height:var(--tap)}
button:active{transform:scale(.985)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);border-color:var(--gold);color:#14170F;font-weight:750;
  letter-spacing:.01em;flex:1}
button.danger{color:var(--down);border-color:rgba(255,138,91,.36);background:transparent}
input[type=time],input[type=text],input[type=number],input[type=datetime-local]{
  font-family:var(--mono);font-size:16px;background:var(--surf2);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:13px 12px;width:100%;min-height:var(--tap)}
input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}

.tr{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--surf);border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:none}
.pos{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--dim);width:22px;flex:0 0 22px}
.paces{display:flex;gap:6px}
.paces input{width:62px;text-align:center;padding:11px 2px;font-size:15px;min-height:48px}

/* ---------- thumb-reach action bar: log from any tab, one-handed ---------- */
.actbar{position:fixed;left:0;right:0;bottom:calc(62px + var(--safe-b));z-index:29;
  padding:10px 15px 12px;background:linear-gradient(180deg,rgba(11,14,12,0),var(--bg) 42%)}
.actbar .ctx{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em;
  text-align:center;margin-bottom:8px;text-shadow:0 1px 6px var(--bg)}
.actbar button{width:100%;min-height:60px;font-size:18px;font-weight:750;
  box-shadow:0 6px 22px rgba(0,0,0,.55)}
.actbar.hide{display:none}

/* ---------- undo: a mistap at 2am should cost one tap, not a menu ---------- */
.toast{position:fixed;left:12px;right:12px;bottom:calc(150px + var(--safe-b));z-index:46;
  background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  box-shadow:0 10px 34px rgba(0,0,0,.6)}
.toast .msg{font-size:15px;font-weight:600}
.toast button{padding:11px 16px;min-height:46px;font-size:15px;color:var(--gold);
  border-color:rgba(255,201,61,.4);background:transparent}

.scrim{position:fixed;inset:0;background:rgba(4,7,5,.78);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surf);
  border-top:1px solid var(--brown);border-radius:18px 18px 0 0;
  padding:16px 15px calc(24px + var(--safe-b));max-height:88vh;overflow:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:38px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 15px}
.fld{margin-bottom:15px}
.fld label{display:block;margin-bottom:7px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:13px;padding:15px 0;border-top:1px solid var(--line)}
.tog .txt{font-size:16px;font-weight:650}
.tog .sub2{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.sw{position:relative;width:56px;height:32px;flex:0 0 56px;background:var(--surf2);
  border:1px solid var(--line);border-radius:17px;cursor:pointer}
.sw.on{background:var(--up);border-color:var(--up)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:var(--ink);transition:transform .2s}
.sw.on i{transform:translateX(24px);background:#0B0E0C}
textarea{width:100%;font-family:var(--mono);font-size:12px;background:var(--surf2);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:12px;min-height:90px;resize:vertical;word-break:break-all}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(11,14,12,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--brown);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:none;border-radius:0;padding:13px 4px 14px;min-height:62px;
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;color:var(--dim);font-weight:700}
nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.seg{display:flex;gap:7px;margin-bottom:13px}
.seg button{flex:1;padding:12px 6px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.seg button.on{background:var(--gold);color:#14170F;border-color:var(--gold);font-weight:750}
.hide{display:none}
.foot{padding:10px 2px 0;font-size:12.5px;color:var(--dim);line-height:1.65}
</style>
</head>

      from push.

/* ============================================================
   PROJECTION MODEL
   Uphill costs ~25 sec per 100 ft climbed. Downhill credit tapers to
   zero by ~6% average grade and reverses past it — the Timberline
   drops cost time and wreck quads rather than banking minutes.
   ============================================================ */
function legMinutes(leg,pace){
  const [mi,,up,dn]=LEGS[leg-1];
  const base=mi*pace;
  if(!S.grade) return base;
  const g=(dn/(mi*5280))*100;
  const rate = g<=3 ? 0.12 : (g<=6 ? 0.12*(6-g)/3 : -0.05);
  return base + up*0.25/60 - dn*rate/60;
}
const rIdx=l=>(l-1)%12, pIdx=l=>Math.floor((l-1)/12);
const baseMin=l=>legMinutes(l,S.runners[rIdx(l)].p[pIdx(l)]);

function compute(){
  const sched=new Date(S.startISO).getTime();
  const P=[sched]; for(let i=1;i<=36;i++) P[i]=P[i-1]+baseMin(i)*60000;
  const carry={};
  if(S.carry){ const acc={};
    for(let i=1;i<=36;i++){ const a=S.times[i],b=S.times[i-1];
      if(a&&b){ const k=rIdx(i); acc[k]=acc[k]||{a:0,p:0};
        acc[k].a+=(new Date(a)-new Date(b))/60000; acc[k].p+=baseMin(i); } }
    for(const k in acc) if(acc[k].p>0) carry[k]=acc[k].a/acc[k].p; }
  const T=[],A=[];
  T[0]=S.times[0]?new Date(S.times[0]).getTime():sched; A[0]=!!S.times[0];
  for(let i=1;i<=36;i++){
    if(S.times[i]){ T[i]=new Date(S.times[i]).getTime(); A[i]=true; }
    else { T[i]=T[i-1]+baseMin(i)*(carry[rIdx(i)]||1)*60000; A[i]=false; } }
  return {P,T,A,carry};
}

function countdown(ms){
  const t=Math.max(0,Math.floor(ms/60000)), p=n=>String(n).padStart(2,'0');
  const d=Math.floor(t/1440), h=Math.floor(t%1440/60), m=t%60, out=[];
  if(d) out.push(d+'d');
  if(d||h) out.push((d?p(h):h)+'h');
  out.push((d||h?p(m):m)+'m');
  return out.join(' ');
}
function dur(ms){ const t=Math.max(0,Math.round(ms/60000));

function delta(ms){ const t=Math.round(ms/60000), s=t<0?'−':'+', a=Math.abs(t);
  return s+(a>=60?Math.floor(a/60)+'h'+String(a%60).padStart(2,'0'):a+'m'); }
function toLocalInput(ms){ return new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16); }

/* ============================================================
   ELEVATION PROFILE
   Builds points that hit the exact exchange elevations and exact
   gain/loss totals; segment order comes from the handbook description.
   Line is coloured by grade so the quad-wreckers read at a glance.
   ============================================================ */
function points(leg){ return GPXD(leg); }
function gradeColor(p,q){
  const g=(q.x-p.x)>0?(q.y-p.y)/((q.x-p.x)*5280)*100:0;
  if(g<=-6) return 'var(--down)';      // steep enough to brake and cook quads
  if(g>=4)  return 'var(--gold)';      // real climbing
  if(g<=-2) return '#B9C4A8';
  return 'var(--muted)';
}
function profileSVG(leg,H){
  H=H||74;
  const pts=points(leg), mi=LEGS[leg-1][0];
  const ys=pts.map(p=>p.y), lo=Math.min(...ys), hi=Math.max(...ys);
  const pad=Math.max(28,(hi-lo)*0.18), top=hi+pad, bot=lo-pad;
  const W=320, PB=13;                                   // PB = room for the mile axis
  const X=v=>v/mi*W, Y=v=>(top-v)/(top-bot)*(H-PB);
  let path=`M0,${Y(pts[0].y).toFixed(1)}`;
  pts.slice(1).forEach(p=>{ path+=`L${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`; });
  const area=path+`L${W},${H-PB}L0,${H-PB}Z`;
  let strokes='';
  for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i];
    strokes+=`<line x1="${X(a.x).toFixed(1)}" y1="${Y(a.y).toFixed(1)}"
      x2="${X(b.x).toFixed(1)}" y2="${Y(b.y).toFixed(1)}"
      stroke="${gradeColor(a,b)}" stroke-width="2.2" stroke-linecap="round"/>`; }
  let ticks='';
  for(let m=1;m<mi;m++){ ticks+=`<line x1="${X(m).toFixed(1)}" y1="${H-PB}" x2="${X(m).toFixed(1)}"
    y2="${H-PB+3}" stroke="var(--line)" stroke-width="1"/>`;
    if(m%2===0||mi<5) ticks+=`<text x="${X(m).toFixed(1)}" y="${H-2}" fill="var(--dim)"
      font-size="8" font-family="ui-monospace,monospace" text-anchor="middle">${m}</text>`; }
  const gid='g'+leg;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      style="width:100%;height:${H}px;display:block" role="img"
      aria-label="Elevation profile for leg ${leg}: starts ${Math.round(ELEV[leg-1])} feet,
      ends ${Math.round(ELEV[leg])} feet, ${LEGS[leg-1][2]} feet of climbing">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C542" stop-opacity=".20"/>
      <stop offset="1" stop-color="#F5C542" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <line x1="0" y1="${H-PB}" x2="${W}" y2="${H-PB}" stroke="var(--line)" stroke-width="1"/>
    ${ticks}${strokes}</svg>`;
}
function steepest(leg){
  const p=points(leg); let best={g:0,at:0};
  const w=Math.max(1,Math.round(0.25/(LEGS[leg-1][0]/(PROFN-1))));
  for(let i=0;i+w<p.length;i++){
    const g=(p[i+w].y-p[i].y)/((p[i+w].x-p[i].x)*5280)*100;
    if(Math.abs(g)>Math.abs(best.g)) best={g,at:(p[i].x+p[i+w].x)/2};
  } return best;
}
function profileBlock(leg){
  const [mi,,up,dn]=LEGS[leg-1];
  const st=steepest(leg);
  return `<div class="prof">
    <div class="profhead">
      <span class="lbl">Elevation · ${Math.round(ELEV[leg-1]).toLocaleString()} ft → ${Math.round(ELEV[leg]).toLocaleString()} ft</span>
      <span class="profg"><b style="color:var(--gold)">▲${up}</b> <b style="color:#B9C4A8">▼${dn}</b></span>
    </div>${profileSVG(leg)}
    <div class="profax"><span>0 mi</span>
      <span style="color:${Math.abs(st.g)>=6?'var(--down)':'var(--muted)'}">
        steepest ${st.g>0?'+':''}${st.g.toFixed(1)}% at mi ${st.at.toFixed(1)}</span>
      <span>${mi.toFixed(2)} mi</span></div></div>`;
}

    document.getElementById('v-'+x).classList.toggle('hide',x!==t);
    const b=document.getElementById('t-'+x); if(b) b.classList.toggle('on',x===t); });
  render(); }
function render(){ const c=compute();
  if(TAB==='now') renderNow(c); else if(TAB==='legs') renderLegs(c); else renderTeam(c);
  paintAct(); }

function renderNow({P,T,A}){
  const now=Date.now(); let cur=0;
  for(let i=1;i<=36;i++){ if(now>=T[i-1]&&now<T[i]){ cur=i; break; } }
  if(now<T[0]) cur=-1; else if(now>=T[36]) cur=37;
  let h='';

  if(cur===-1){
    h+=`<div class="card"><div class="lbl">Start line · Timberline Lodge</div>
      <div class="runner" style="margin-top:7px">${countdown(T[0]-now)}</div>
      <div class="legline">until ${dhm(T[0])} · Ben on Leg 1</div>
      <div class="legline" style="color:var(--gold)">Van 1 checks in 30 min early. Van 2 goes straight to Exchange 6.</div></div>`;
  } else if(cur===37){
    h+=`<div class="card bone"><div class="bz"><span class="skull">💀</span>
      <div><div class="bzt">Out of the Bone Zone</div>
      <div class="bzs">196.68 MILES · SEASIDE</div></div></div>
      <div class="runner">${dur(T[36]-T[0])}</div>
      <div class="legline">${dhm(T[36])} · ${((T[36]-T[0])/60000/196.68).toFixed(2)} min/mi · go find the beer garden</div></div>`;
  } else {
    const r=S.runners[rIdx(cur)], mi=LEGS[cur-1][0], rate=LEGS[cur-1][1];
    const el=now-T[cur-1], tot=T[cur]-T[cur-1], pct=Math.min(100,Math.max(0,el/tot*100));
    h+=`<div class="card ${inBZ(cur)?'bone':'live'}">`;
    if(inBZ(cur)) h+=`<div class="bz"><span class="skull">💀</span>
      <div><div class="bzt">You are in the Bone Zone</div>
      <div class="bzs">NO SIGNAL · FULL DARK · LEGS ${BZ_FROM}–${BZ_TO}</div></div></div>`;
    h+=`<div class="livetop"><span class="pulse"><span class="dot"></span>ON COURSE</span>
        <span class="lbl">Leg ${cur} of 36</span></div>
      <div class="runner">${r.n}</div>
      <div class="legline">Van ${r.v} · ${mi.toFixed(2)} mi · ${rate}${isNight(now)?' · headlamp + vest + flashers':''}</div>
      <div class="grid3">
        <div class="cel"><div class="lbl">Elapsed</div><div class="v">${mmss(el)}</div></div>
        <div class="cel"><div class="lbl">Handoff</div><div class="v">${hm(T[cur])}</div></div>
        <div class="cel"><div class="lbl">Remaining</div><div class="v">${mmss(T[cur]-now)}</div></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      </div>`;
    if(cur<36){ const nx=S.runners[rIdx(cur+1)], nl=cur+1;
      h+=`<div class="card" style="padding:11px 14px 13px"><div class="lbl">On deck</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px">
          <div><span style="font-size:17px;font-weight:700">${nx.n}</span>
          <span class="legline"> Leg ${nl} · ${LEGS[cur][0].toFixed(2)} mi · ${LEGS[cur][1]}</span></div>
          <div class="mono" style="font-size:15px;font-weight:700">${hm(T[cur])}</div></div>
        <div class="prof" style="margin-top:9px">
          <div class="profhead"><span class="lbl">${Math.round(ELEV[nl-1]).toLocaleString()} ft → ${Math.round(ELEV[nl]).toLocaleString()} ft</span>
          <span class="profg"><b style="color:var(--gold)">▲${LEGS[cur][2]}</b> <b style="color:#B9C4A8">▼${LEGS[cur][3]}</b></span></div>
          ${profileSVG(nl,58)}</div></div>`; }
  }

  const v=T[36]-P[36], cls=Math.abs(v)<60000?'flat':(v<0?'up':'down');
  h+=`<div class="card"><div class="lbl">Projected finish · Seaside</div>
    <div class="finish" style="margin-top:7px">
      <div><div class="big">${dhm(T[36])}</div>
        <div class="legline">${dur(T[36]-T[0])} elapsed · ${((T[36]-T[0])/60000/196.68).toFixed(2)} min/mi</div></div>
      <div class="var ${cls}">${delta(v)}</div></div>
    <div class="legline" style="margin-top:11px;color:var(--dim)">
      Plan ${dhm(P[36])} · HTC estimate Sat 7:34a · course closes Sat 9:00p</div></div>`;

  h+=`<div class="secthead"><span class="poster" style="font-size:15px">Van exchanges</span><span class="rule"></span></div><div class="rows">`;
  MAJOR.forEach(x=>{ const done=A[x], takes=(x===6||x===18||x===30)?2:1;
    h+=`<div class="row ${done?'done':''} ${inBZ(x)?'bz':''}" style="cursor:default">
      <div class="legno">${x}</div>
      <div class="vbar" style="background:${takes===1?'var(--van1)':'var(--van2)'}"></div>
      <div class="rmid"><div class="rname" style="font-size:14px">Exchange ${x}</div>
      <div class="rmeta">Van ${takes} takes over</div></div>
      <div class="rtime"><div class="t">${hm(T[x])}</div>
      <div class="d" style="color:var(--dim)">${done?'logged':'projected'}</div></div></div>`; });
  h+=`</div><div class="foot">Times recalculate from the last handoff you log. Everything works with no signal — legs ${BZ_FROM} through ${BZ_TO} have none.</div>`;
  document.getElementById('v-now').innerHTML=h;
}

function setVan(v){ VAN=v; render(); }
function renderLegs({P,T,A}){
  const now=Date.now();
  let h=`<div class="seg">
    <button class="${VAN===0?'on':''}" onclick="setVan(0)">ALL 36</button>
    <button class="${VAN===1?'on':''}" onclick="setVan(1)">VAN 1</button>
    <button class="${VAN===2?'on':''}" onclick="setVan(2)">VAN 2</button></div>`;
  let open=false, marked=false;
  for(let i=1;i<=36;i++){
    const r=S.runners[rIdx(i)]; if(VAN&&r.v!==VAN) continue;
    if(inBZ(i)&&!marked){ if(open){h+='</div>';open=false;} marked=true;
      h+=`<div class="secthead"><span class="skull" style="font-size:15px">💀</span>
        <span class="poster" style="font-size:16px">The Bone Zone</span><span class="rule"></span>
        <span class="lbl" style="color:var(--down)">NO SIGNAL</span></div>`; }
    if(!open){ h+=`<div class="rows ${marked&&inBZ(i)?'bonezone':''}">`; open=true; }
    const mi=LEGS[i-1][0], rate=LEGS[i-1][1];
    const done=A[i], live=(now>=T[i-1]&&now<T[i]&&!done);
    const dv=T[i]-P[i], vc=Math.abs(dv)<60000?'var(--dim)':(dv<0?'var(--up)':'var(--down)');
    const rt=rate==='VH'?'vh':(rate==='H'?'h':'');
    h+=`<div class="row ${done?'done':''} ${live?'now':''} ${inBZ(i)?'bz':''}" onclick="toggle(${i})">
      <div class="legno">${i}</div>
      <div class="vbar" style="background:${r.v===1?'var(--van1)':'var(--van2)'}"></div>
      <div class="rmid"><div class="rname">${r.n}</div>
        <div class="rmeta">${mi.toFixed(2)} mi<span class="tag ${rt}">${rate}</span>
        ${isNight(T[i-1])?'<span class="tag">NIGHT</span>':''}
        ${MAJOR.includes(i)?'<span class="tag">VAN SWAP</span>':''}</div></div>
      <div class="rtime"><div class="t">${hm(T[i-1])}</div>
        <div class="d" style="color:${vc}">${done?delta(dv):dur(T[i]-T[i-1]).replace('h',':')}</div></div></div>`;
    if(OPEN===i) h+=detail(i,T,A);
    if(i===BZ_TO&&marked){ h+='</div>'; open=false;
      h+=`<div class="secthead"><span class="poster" style="font-size:15px">Home stretch</span><span class="rule"></span></div>`; }
  }
  if(open) h+='</div>';
  h+=`<div class="foot">Tap any leg for terrain notes and to log or edit its handoff. One tap sets that runner's finish and the next runner's start together.</div>`;
  document.getElementById('v-legs').innerHTML=h;
}

function detail(i,T,A){
  const [mi,rate,up,dn,note]=LEGS[i-1], f=[];
  if(isNight(T[i-1])) f.push(['warn','HEADLAMP + VEST + FLASHERS']);
  if(inBZ(i)) f.push(['hot','NO CELL SIGNAL']);
  if(GRAVEL.includes(i)) f.push(['','GRAVEL / DUST']);
  if(MAJOR.includes(i)) f.push(['cold','MAJOR VAN EXCHANGE']);
  f.push(['',`+${up} / −${dn} FT`]);
  return `<div class="det">
    <div class="flags">${f.map(([c,t])=>`<span class="flag ${c}">${t}</span>`).join('')}</div>
    ${profileBlock(i)}
    <p>${note}</p>
    ${SPECTATE?'':`<div class="btnrow">
      <button class="primary" onclick="event.stopPropagation();logNow(${i})">
        ${A[i]?'Re-log this':'Log this handoff'}</button>
      <button onclick="event.stopPropagation();editTime(${i})">Edit</button>
      ${A[i]?`<button class="danger" onclick="event.stopPropagation();clearTime(${i})">Clear</button>`:''}
    </div>`}</div>`;
}

function renderTeam(){
  let h=`<div class="secthead"><span class="poster" style="font-size:15px">The Roster</span><span class="rule"></span>
    <span class="lbl">MIN/MI BY LEG</span></div><div class="rows">`;
  S.runners.forEach((r,k)=>{
    const legs=[k+1,k+13,k+25], mi=legs.reduce((a,l)=>a+LEGS[l-1][0],0);
    h+=`<div class="tr"><div class="pos">${k+1}</div>
      <div class="vbar" style="background:${r.v===1?'var(--van1)':'var(--van2)'}"></div>
      <div class="rmid"><div class="rname">${r.n}</div>
        <div class="rmeta">Legs ${legs.join(' · ')} · ${mi.toFixed(2)} mi</div></div>
      <div class="paces">${[0,1,2].map(j=>
        `<input type="number" step="0.05" min="3" max="20" value="${r.p[j].toFixed(2)}"
          onchange="setPace(${k},${j},this.value)" aria-label="${r.n} leg ${j+1} pace">`).join('')}</div></div>`; });
  h+=`</div><div class="foot">196.68 miles across 36 legs. Paces are flat-road effort — the grade model
    adjusts each leg for its own climb and descent. Change a pace and every leg that runner has left reprojects.</div>`;
  document.getElementById('v-team').innerHTML=h;
}

/* ============================================================
   ACTIONS
   ============================================================ */
/* The single most-used control sits in thumb reach on every tab, so
   logging a handoff never requires reaching the top of the screen or
   hunting for the right leg. It targets whatever leg is live right now. */
function paintAct(){
  const el=document.getElementById('act'); if(!el) return;
  if(SPECTATE){ el.className='actbar hide'; return; }
  const {T}=compute(), now=Date.now(); let cur=0;
  for(let i=1;i<=36;i++){ if(now>=T[i-1]&&now<T[i]){ cur=i; break; } }
  if(!cur){ el.className='actbar hide'; el.innerHTML=''; return; }
  const r=S.runners[rIdx(cur)];
  el.className='actbar';
  el.innerHTML=`<div class="ctx">LEG ${cur} · ${r.n.toUpperCase()} · DUE ${hm(T[cur])}</div>
    <button class="primary" onclick="logNow(${cur})">LOG HANDOFF</button>`;
}
let undoT=null;
function toast(msg,undo){
  const el=document.getElementById('toast'); if(!el) return;
  clearTimeout(undoT);
  el.innerHTML=`<div class="toast"><span class="msg">${msg}</span>
    ${undo?'<button onclick="undoLast()">UNDO</button>':''}</div>`;
  undoT=setTimeout(()=>{ el.innerHTML=''; LAST=null; },9000);
}
let LAST=null;
function undoLast(){ if(!LAST) return;
  if(LAST.prev===undefined) delete S.times[LAST.e]; else S.times[LAST.e]=LAST.prev;
  const e=LAST.e; LAST=null; document.getElementById('toast').innerHTML='';
  save(); render(); mark(e); }

function toggle(i){ OPEN=(OPEN===i?null:i); render(); }
function logNow(i){ if(SPECTATE) return;
  const d=new Date(); d.setSeconds(0,0);
  LAST={e:i,prev:S.times[i]};
  S.times[i]=toLocalInput(d.getTime()); OPEN=null; save(); render(); mark(i);
  toast(`Exchange ${i} logged ${hm(d.getTime())}`, true); }
function clearTime(i){ if(SPECTATE) return; delete S.times[i]; save(); render(); mark(i); }
function setPace(k,j,v){ if(SPECTATE) return; const n=parseFloat(v);
  if(!isNaN(n)&&n>0){ S.runners[k].p[j]=n; S.pendSet=true; save(); render(); sync(); } }
function editTime(i){ const {T}=compute();
  const v=prompt(`Handoff time at Exchange ${i}\nFormat YYYY-MM-DDTHH:MM (24-hour)`, S.times[i]||toLocalInput(T[i]));
  if(v && !isNaN(new Date(v).getTime())){ S.times[i]=v; save(); render(); mark(i); } }

function openSheet(){ const n=Object.keys(S.times).length;
  document.getElementById('sheetbody').innerHTML=`
    <div class="fld"><label class="lbl">Team start time</label>
      <input type="datetime-local" value="${S.startISO}" onchange="setStart(this.value)"></div>
    <div class="tog"><div><div class="txt">Grade adjustment</div>
      <div class="sub2">Adds time for climbing, credits gentle descents, and penalises the quad-wrecking drops on legs 1 and 2.</div></div>
      <div class="sw ${S.grade?'on':''}" onclick="flip('grade')" role="switch" tabindex="0"><i></i></div></div>
    <div class="tog"><div><div class="txt">Carry observed pace forward</div>
      <div class="sub2">If a runner is beating or missing their estimate, apply that same ratio to their remaining legs. Leave off until a few legs are in the books.</div></div>
      <div class="sw ${S.carry?'on':''}" onclick="flip('carry')" role="switch" tabindex="0"><i></i></div></div>
    <div class="tog" style="display:block">
      <div class="txt" style="margin-bottom:4px">Sync</div>
      <div class="sub2" style="margin-bottom:9px">
        ${SPECTATE?'Spectator mode — this device never writes.':
        `All twelve phones share one log. ${n} time${n===1?'':'s'} logged`+
        `${Object.keys(S.pend||{}).length?', '+Object.keys(S.pend).length+' still queued to send':''}.`}
        ${NET.at?'Last synced '+hm(NET.at)+'.':'Not synced yet.'}
        ${NET.msg?'<br>Server said: '+NET.msg.replace(/</g,'&lt;'):''}</div>
      <div class="btnrow" style="margin-bottom:12px">
        <button class="primary" onclick="sync()">Sync now</button>
        <button onclick="shareWatch()">Spectator link</button></div>
      <div class="txt" style="margin-bottom:4px">Manual van handoff</div>
      <div class="sub2" style="margin-bottom:9px">Backup for the Bone Zone, where there is no signal to sync over. Paste this into the other van's phone at Exchange 18, 24 or 30.</div>
      <textarea readonly onclick="this.select()">${btoa(JSON.stringify({t:S.times,r:S.runners,s:S.startISO}))}</textarea>
      <div class="btnrow" style="margin-top:9px">
        <button class="primary" onclick="pasteSync()">Paste from other van</button></div></div>
    ${SPECTATE?'':`<div class="tog"><div><div class="txt">Reset logged times</div>
      <div class="sub2">Clears every handoff. Roster and paces stay.</div></div>
      <button class="danger" onclick="resetTimes()">Reset</button></div>`}
    <div class="foot">Build ${VER} · device ${DEV}<br>
      ${store.ok?'Saved on this phone, then shared with the team when there is signal.':'Preview mode — nothing persists until this is hosted.'}<br>
      If someone sees different numbers to you, compare build stamps first.</div>`;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on'); }
function setStart(v){ if(v){ S.startISO=v; S.pendSet=true; save(); render(); sync(); } }
function flip(k){ S[k]=!S[k]; save(); openSheet(); render(); }
function resetTimes(){ if(!confirm('Clear every logged handoff time, for the whole team?')) return;
  S.pend=S.pend||{}; for(let e=0;e<=36;e++) if(S.times[e]!==undefined) S.pend[e]=1;
  S.times={}; save(); openSheet(); render(); sync(); }
function pasteSync(){ const v=prompt('Paste the handoff code from the other van:'); if(!v) return;
  try{ const o=JSON.parse(atob(v.trim())); if(!o.t) throw 0;
    S.times=o.t; if(o.r&&o.r.length===12) S.runners=o.r; if(o.s) S.startISO=o.s;
    save(); openSheet(); render();
  }catch(e){ alert("That code didn't read cleanly. Copy the whole block from the other phone and try again."); } }

function shareWatch(){ const u=location.origin+location.pathname+'?spectate';
  if(navigator.share) navigator.share({title:'Short Squeeze — HTC 2026',url:u}).catch(()=>{});
  else { prompt('Read-only link for family and friends:',u); } }

render(); paintNet(); paintAct(); sync();
setInterval(()=>{ if(TAB==='now'&&!document.hidden) render(); },1000);
setInterval(()=>{ if(!document.hidden) sync(); },15000);
addEventListener('online',()=>sync());
addEventListener('offline',()=>{ NET.s='off'; paintNet(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) sync(); });
</script>
</body>
</html>
